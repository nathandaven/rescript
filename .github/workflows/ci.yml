name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (web)
        run: |
          # next-env.d.ts is gitignored; generate it (and route types) before tsc.
          pnpm exec next typegen
          pnpm exec tsc --noEmit

      - name: Typecheck (electron)
        run: pnpm typecheck:electron

      - name: UI localization tests
        run: pnpm test:i18n

      - name: Timeline export tests
        run: pnpm test:timeline

      # The native-engine tests render through the same static ffmpeg the
      # desktop app bundles (they skip, rather than fail, without it).
      - name: Fetch native ffmpeg
        run: pnpm fetch:ffmpeg -- --host

      - name: ffmpeg tests
        run: pnpm test:ffmpeg

      - name: Build Next.js
        run: pnpm build

      - name: Build Electron main/preload
        run: pnpm build:electron
